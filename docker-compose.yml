volumes:
  python-venv:
  viteapp-node-modules:


services:
  web:
    build: ./docker/web
    volumes:
      - ./backend:/code
    ports:
      - '80:80'

  db:
    build: ./docker/db
    volumes:
      - ./docker/db/data:/var/lib/mysql
    expose:
      - '3306'
    ports:
      - '3306:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=cotwo
      - MYSQL_USER=django
      - MYSQL_PASSWORD=password
      - TZ=Asia/Tokyo
    healthcheck:
      # test: ["CMD", "mysqladmin", "ping", "-p$${MYSQL_ROOT_PASSWORD}"]
      # mysqladminコマンドが存在しないため、mariadbにログインしてstatusで代替する
      test: ["CMD", "echo", "'status'", "|", "mariadb", "-u$${MYSQL_USER}", "--password={MYSQL_PASSWORD}"]
      interval: 2s
      timeout: 10s
  
  redis:
    build: ./docker/redis
    ports:
      - '6379:6379'
  backend:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    volumes:
      - ./backend:/code
      - python-venv:/code/.venv
    expose:
      - '8001'
    ports:
      - '8001:8001'

  daemon:
    build:
      context: .
      dockerfile: ./docker/daemon/Dockerfile
    volumes:
      - ./daemon:/code
    command: python environment_logger.py
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile
    volumes:
      - ./frontend:/code
      - viteapp-node-modules:/code/node_modules
